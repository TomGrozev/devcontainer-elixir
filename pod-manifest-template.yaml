apiVersion: v1
kind: Pod
metadata:
  name: pod-template
spec:
  volumes:
    - name: opencode-auth-secret
      secret:
        secretName: opencode-auth
        defaultMode: 0640
        items:
          - key: auth.json
            path: auth.json
    - name: opencode-auth
      emptyDir:
        medium: Memory
  initContainers:
    - name: copy-auth
      image: busybox
      command:
        - sh
        - -c
        - "cp /secret/auth.json /auth/auth.json && chmod 0600 /auth/auth.json"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumeMounts:
        - name: opencode-auth-secret
          mountPath: /secret
          readOnly: true
        - name: opencode-auth
          mountPath: /auth
  containers:
    - name: devpod
      resources: {}
      volumeMounts:
        - name: opencode-auth
          mountPath: /home/dev/.local/share/opencode
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
  restartPolicy: Always
