apiVersion: v1
kind: Pod
metadata:
  name: pod-template
spec:
  volumes:
    - name: opencode-auth-secret
      secret:
        secretName: opencode-auth
        defaultMode: 0640
        items:
          - key: auth.json
            path: auth.json
    - name: local-share
      emptyDir:
        medium: Memory
        sizeLimit: 300Mi
  initContainers:
    - name: copy-auth
      image: busybox
      command:
        - sh
        - -c
        - "mkdir -p /share/opencode && cp /secret/auth.json /share/opencode/auth.json && chmod 0600 /share/opencode/auth.json"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumeMounts:
        - name: opencode-auth-secret
          mountPath: /secret
          readOnly: true
        - name: local-share
          mountPath: /share
  containers:
    - name: devpod
      resources: {}
      volumeMounts:
        - name: local-share
          mountPath: /home/dev/.local/share
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
  restartPolicy: Always
